openapi: 3.0.3
info:
  title: MiniBase 管控 API
  version: 2.0.0
  description: |
    MiniBase 管控面 API。应用是唯一顶层资源；数据库、文件、密钥都归应用。
    路径规则：资源用 HTTP 方法表达动作（GET 查 / PUT 改 / DELETE 删），命令用 /actions/ 后缀。
    应用流量 /apps/... 和公开文件 /files/... 不在本文件范围内。
    除 /api/system/health 外，所有接口需要 Authorization: Bearer <token>。
servers:
- url: http://{host}:{port}
  description: MiniBase Core
  variables:
    host:
      default: 127.0.0.1
      description: Core 所在主机
    port:
      default: '8080'
      description: Core 监听端口
security:
- bearerAuth: []
tags:
- name: 系统
  description: 健康检查、资源用量、审计账本、日志开关、Token 轮换
- name: 应用管理
  description: 部署、查询、编辑、删除、环境变量、密钥、版本、日志、用量
- name: 数据库
  description: 库、表、索引结构管理
- name: 文件存储
  description: 应用文件上传、下载、列表、删除
- name: 安全
  description: 应用级 CORS 白名单
paths:
  /api/system/health:
    get:
      tags: [系统]
      summary: 健康检查
      operationId: health
      security: []
      responses:
        '200': {description: Core 正常}
  /api/system/usage:
    get:
      tags: [系统]
      summary: 系统资源用量总览
      operationId: getUsage
      responses:
        '200': {description: 成功}
  /api/system/audit:
    get:
      tags: [系统]
      summary: 审计账本
      operationId: listAuditLogs
      parameters:
      - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        '200': {description: 成功}
  /api/system/log-control:
    get:
      tags: [系统]
      summary: 查询日志开关
      operationId: getLogControl
      responses:
        '200': {description: 成功}
    post:
      tags: [系统]
      summary: 设置日志开关
      operationId: setLogControl
      responses:
        '200': {description: 成功}
  /api/system/token/rotate:
    post:
      tags: [系统]
      summary: 轮换管理员 Token
      operationId: rotateToken
      responses:
        '200': {description: 成功，返回新 Token}
  /api/apps:
    get:
      tags: [应用管理]
      summary: 应用列表
      operationId: listApps
      parameters:
      responses:
        '200': {description: 成功}
    post:
      tags: [应用管理]
      summary: 部署应用（上传 zip）
      operationId: deploy
      parameters:
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/DeployRequest'}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}:
    get:
      tags: [应用管理]
      summary: 应用详情
      operationId: getApp
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    put:
      tags: [应用管理]
      summary: 编辑应用配置（需先停止）
      operationId: updateApp
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppConfigWrite'}
      responses:
        '200': {description: 成功}
        '409': {description: 状态不允许}
    delete:
      tags: [应用管理]
      summary: 彻底删除应用
      operationId: deleteApp
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/env:
    get:
      tags: [应用管理]
      summary: 查询环境变量与密钥
      operationId: getEnv
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    post:
      tags: [应用管理]
      summary: 设置环境变量与密钥
      operationId: setEnv
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnvWrite'}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/secrets:
    get:
      tags: [应用管理]
      summary: 查询密钥列表
      operationId: listSecrets
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    post:
      tags: [应用管理]
      summary: 写入加密密钥
      operationId: setSecrets
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/versions:
    get:
      tags: [应用管理]
      summary: 版本列表
      operationId: listVersions
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/deployments:
    get:
      tags: [应用管理]
      summary: 部署与运维历史
      operationId: listDeployments
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/logs:
    get:
      tags: [应用管理]
      summary: 应用日志尾部
      operationId: getAppLog
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/usage:
    get:
      tags: [应用管理]
      summary: 单应用资源用量
      operationId: getAppUsage
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/actions/resume:
    post:
      tags: [应用管理]
      summary: 恢复应用
      operationId: resumeApp
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
        '409': {description: 状态不允许}
  /api/apps/{appId}/actions/pause:
    post:
      tags: [应用管理]
      summary: 暂停应用（保留数据）
      operationId: pauseApp
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/actions/restart:
    post:
      tags: [应用管理]
      summary: 重启应用
      operationId: restartApp
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/actions/rollback:
    post:
      tags: [应用管理]
      summary: 回滚到上一个版本
      operationId: rollback
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/files:
    get:
      tags: [文件存储]
      summary: 文件列表
      operationId: storageList
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    post:
      tags: [文件存储]
      summary: 上传文件
      operationId: storageUpload
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          multipart/form-data:
            schema: {type: object, properties: {file: {type: string, format: binary}}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/files/{fileId}:
    get:
      tags: [文件存储]
      summary: 下载文件
      operationId: storageDownload
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: fileId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    delete:
      tags: [文件存储]
      summary: 删除文件
      operationId: storageDelete
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: fileId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/databases:
    get:
      tags: [数据库]
      summary: 库信息
      operationId: getDatabaseInfo
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    post:
      tags: [数据库]
      summary: 新建应用库
      operationId: createDatabase
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
        '409': {description: 库已存在}
  /api/apps/{appId}/databases/{db}:
    get:
      tags: [数据库]
      summary: 库详情
      operationId: getDatabase
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    delete:
      tags: [数据库]
      summary: 删除库（默认库不可删）
      operationId: deleteDatabase
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/databases/{db}/tables:
    get:
      tags: [数据库]
      summary: 表列表
      operationId: listTables
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    post:
      tags: [数据库]
      summary: 建表
      operationId: createTable
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TableCreate'}
      responses:
        '200': {description: 成功}
        '400': {description: 参数错误}
  /api/apps/{appId}/databases/{db}/tables/{table}:
    get:
      tags: [数据库]
      summary: 表结构详情
      operationId: getTable
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: table, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    put:
      tags: [数据库]
      summary: 重命名表
      operationId: renameTable
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: table, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    delete:
      tags: [数据库]
      summary: 删表
      operationId: dropTable
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: table, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/databases/{db}/tables/{table}/indexes:
    post:
      tags: [数据库]
      summary: 建索引
      operationId: createIndex
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: table, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IndexCreate'}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/databases/{db}/tables/{table}/indexes/{index}:
    delete:
      tags: [数据库]
      summary: 删索引
      operationId: dropIndex
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: table, in: path, required: true, schema: {type: string}}
      - {name: index, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/cors:
    get:
      tags: [安全]
      summary: 查询 CORS 白名单
      operationId: listCorsDomains
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
    post:
      tags: [安全]
      summary: 添加 CORS 域名
      operationId: addCorsDomain
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}
  /api/apps/{appId}/cors/{id}:
    delete:
      tags: [安全]
      summary: 删除 CORS 域名
      operationId: deleteCorsDomain
      parameters:
      - {name: appId, in: path, required: true, schema: {type: string}}
      - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 成功}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  responses:
    BadRequest:
      description: 请求错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token 缺失或错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          example: ok
    DeployRequest:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: Node.js 项目 zip 包
        app:
          type: string
          description: 应用名，不传时取 package.json 的 name
        mode:
          type: string
          enum:
          - a
          - b
          default: b
          description: a=包里带 node_modules；b=平台执行 npm install
    DeployResult:
      type: object
      properties:
        app_name:
          type: string
        root_path:
          type: string
        version:
          type: string
        port:
          type: integer
        status:
          type: string
        access_url:
          type: string
        notice:
          type: string
        file:
          type: string
    AppStatus:
      type: object
      properties:
        app_name:
          type: string
        root_path:
          type: string
        current_version:
          type: string
        previous_version:
          type: string
        port:
          type: integer
        status:
          type: string
        access_url:
          type: string
        notice:
          type: string
    LegacyLog:
      type: object
      properties:
        app_name:
          type: string
        logs:
          type: string
        notice:
          type: string
    AppLogLine:
      type: object
      properties:
        time: {type: string, description: "格式化时间，如 11-24 10:30:00"}
        level: {type: string, description: "TRACE/DEBUG/INFO/WARN/ERROR/FATAL/PANIC"}
        message: {type: string}
        raw: {type: string}
    AppLogResult:
      type: object
      properties:
        logs: {type: string, description: 原始日志文本}
        lines:
          type: array
          items: {$ref: '#/components/schemas/AppLogLine'}
    AppListItem:
      type: object
      properties:
        id:
          type: string
          description: 应用 ID，管控面板路径使用
        app_name:
          type: string
        status:
          type: string
        current_version:
          type: string
        port:
          type: integer
        access_url:
          type: string
    LogControlItem:
      type: object
      properties:
        scope:
          type: string
        app_name:
          type: string
        enabled:
          type: boolean
        level:
          type: string
        expires_at:
          type: integer
          format: int64
    LogControlStatus:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/LogControlItem'
    LogControlRequest:
      type: object
      required:
      - scope
      - enabled
      properties:
        scope:
          type: string
          enum:
          - control
          - app
          description: 日志范围
        app_name:
          type: string
          description: scope=app 时指定应用名
        enabled:
          type: boolean
        duration_sec:
          type: integer
          description: 自动关闭秒数，0 表示不自动关闭
        level:
          type: string
          enum:
          - all
          - error
          default: error
    AuditLog:
      type: object
      properties:
        id:
          type: string
        app_id:
          type: string
        event:
          type: string
        from_status:
          type: string
        to_status:
          type: string
        reason:
          type: string
        created_at:
          type: integer
          format: int64
    DataRow:
      type: object
      additionalProperties: true
      description: 应用库的一行数据；字段名由业务决定
    DataWrite:
      type: object
      additionalProperties: true
      description: 字段名需匹配 `^[A-Za-z_][A-Za-z0-9_]*$`
    WriteResult:
      type: object
      properties:
        status:
          type: string
          example: ok
        id:
          type: string
    UpdateResult:
      type: object
      properties:
        status:
          type: string
          example: ok
        affected:
          type: integer
    Ok:
      type: object
      properties:
        status:
          type: string
          example: ok
    OkNotice:
      type: object
      properties:
        status:
          type: string
          example: ok
        notice:
          type: string
    CountResult:
      type: object
      properties:
        status:
          type: string
          example: ok
        count:
          type: integer
    StorageUploadResult:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
    StorageObject:
      type: object
      properties:
        id:
          type: string
        app_name:
          type: string
        file_name:
          type: string
        size:
          type: integer
          format: int64
        content_type:
          type: string
        created_at:
          type: integer
          format: int64
    StorageMigrateResult:
      type: object
      properties:
        status:
          type: string
        notice:
          type: string
    RollbackResult:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        port:
          type: integer
        access_url:
          type: string
    AppDetailStatus:
      type: object
      properties:
        app_name:
          type: string
        status:
          type: string
        current_version:
          type: string
        previous_version:
          type: string
        restart_count:
          type: integer
        history:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
    SecretWrite:
      type: object
      additionalProperties:
        type: string
      description: 键值对形式的密钥，值会被加密存储
    EnvWrite:
      type: object
      description: 普通变量和密钥走同一个接口；`_secret` 中列出的键按密钥加密存储
      properties:
        _secret:
          type: array
          items:
            type: string
          description: 需要加密存储的键名列表
      additionalProperties: true
      example:
        NODE_ENV: production
        API_KEY: abc
        _secret:
        - API_KEY
    EnvItem:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        is_secret:
          type: boolean
    EnvSetResult:
      type: object
      properties:
        status:
          type: string
          example: ok
        count:
          type: integer
        notice:
          type: string
    AppLogResult:
      type: object
      properties:
        logs:
          type: string
    TableCreate:
      type: object
      required: [name, fields]
      properties:
        name: {type: string}
        fields:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: {type: string}
              type: {type: string, enum: [TEXT, INTEGER, REAL, BLOB]}
              not_null: {type: boolean, default: false}
    IndexCreate:
      type: object
      required: [name, fields]
      properties:
        name: {type: string}
        fields:
          type: array
          items: {type: string}
        unique: {type: boolean, default: false}
    AppConfigWrite:
      type: object
      properties:
        memory_limit_mb: {type: integer, minimum: 32, maximum: 4096}
        cpu_quota_percent: {type: integer, minimum: 1, maximum: 100}
        start_cmd: {type: string}
        health_path: {type: string}
        health_timeout_ms: {type: integer, minimum: 100, maximum: 60000}
      description: 未提供的字段保持继承全局配置
    CorsDomain:
      type: object
      properties:
        id: {type: string}
        domain: {type: string}
        created_at: {type: integer, format: int64}
